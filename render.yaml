services:
  - type: web
    name: finance-tracker-api
    env: python
    plan: free
    buildCommand: pip install -r requirements-core.txt
    startCommand: uvicorn app_demo:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    envVars:
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: CORS_ORIGINS
        value: "*"
      - key: UPLOAD_DIR
        value: /tmp/uploads
