services:
  - type: web
    name: finance-tracker-api
    env: python
    plan: free
    buildCommand: python -m pip install --upgrade pip && python -m pip install -r requirements-core.txt
    startCommand: python -m gunicorn.app.wsgiapp app_demo:app --workers 1 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    rootDir: backend
    envVars:
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: CORS_ORIGINS
        value: https://finova-qvey.onrender.com
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: PYTHONUNBUFFERED
        value: "1"
