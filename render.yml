services:
  - type: web
    name: finance-tracker-api
    env: python
    pythonVersion: 3.13.12
    plan: free
    buildCommand: |
      python -m pip install --upgrade pip setuptools wheel && python -m pip install -r requirements-core.txt
    startCommand: gunicorn main:app --workers 4 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --timeout 120
    rootDir: backend
    envVars:
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: https://finova-qvey.onrender.com,https://finova-fpr3.onrender.com,http://localhost:3000
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: REACT_APP_API_URL
        value: https://finova-fpr3.onrender.com/api
