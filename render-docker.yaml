services:
  - type: web
    name: finance-tracker-api-docker
    env: docker
    plan: free
    dockerfilePath: Dockerfile.backend
    rootDir: .
    envVars:
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: https://finova-qvey.onrender.com,https://finova-fpr3.onrender.com,http://localhost:3000
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: PYTHONUNBUFFERED
        value: "1"
